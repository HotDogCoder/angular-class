@if (pokemons$ | async; as data) {

<table>

    <thead>
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>URL</th>
        </tr>
    </thead>

    <tbody>

        @for (item of data.results; track item.name) {

        <tr>
            <td>{{ $index + 1 }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.url }}</td>
        </tr>

        }

    </tbody>

</table>

} @else {

<p>Loading...</p>

}
